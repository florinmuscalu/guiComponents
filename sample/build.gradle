apply plugin: 'com.android.application'

android {
  compileSdk = 36

  defaultConfig {
    applicationId "tech.zekon.sample"
    minSdk 28
    targetSdk 36
    versionCode 1
    versionName "1.0"
  }
  buildTypes {
    release {
      minifyEnabled false
      proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
    }
  }
    namespace 'tech.zekon.sample'
}

dependencies {
  implementation fileTree(dir: 'libs', include: ['*.jar'])
    implementation project(':gui')
}
